name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Database security tests (runs the SQL migration on a throwaway Postgres)
        run: sudo bash scripts/test-rls.sh
      - name: Build
        run: npm run build
        env:
          # Placeholders only so the build is complete; real values are set on Cloudflare.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key-ci-placeholder-key
